# nova-astro.app: the website (..\website, with the screenshots from ..\docs\images) as static
# files on a Cloudflare Worker. Deploy with deploy.bat.
name = "nova-astro-site"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [
  { pattern = "nova-astro.app", custom_domain = true },
  { pattern = "www.nova-astro.app", custom_domain = true },
]

[assets]
directory = "./public"          # filled by deploy.bat
binding = "ASSETS"
not_found_handling = "404-page"
# Through the Worker first, so www is redirected to the bare domain instead of being a duplicate.
run_worker_first = true
